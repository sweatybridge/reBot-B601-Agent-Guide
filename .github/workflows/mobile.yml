# Two layers of verification (converted from the example's original GitLab CI):
#
# 1. core-tests — the Swift port of the page's math, cross-validated against
#    fixtures generated from the REAL web JS of this repo (Node runs
#    aruco.js / geometry.js / arm-model.js / locate.js to produce expected
#    outputs). Pure Foundation + XCTest in a swift:6.0 container, so it runs
#    on Linux with no iOS SDK.
#
# 2. ios-sdk-tests — builds the FULL app (SwiftUI + AVFoundation + WebRTC)
#    for the iOS simulator SDK and runs the same suite as an Xcode test
#    bundle (RebotCaptureTests) on a GitHub-hosted macOS runner (Xcode 16).
#    continue-on-error mirrors GitLab's allow_failure: a flaky macOS layer
#    never blocks the pipeline; the Linux core tests remain the required
#    gate.
#
# Test fixtures (.gray renders + expected JSON) are generated, not committed:
# tools/gen_fixtures.js writes them from the checked-out guide repo before
# tests run. Unlike the GitLab job (which cloned the guide repo's default
# branch), this uses the same commit's web JS, so fixtures never go stale.
#
# Publishing: testflight — on every push to main that touches iOS code, archives
# the app (Release, automatic signing driven by an App Store Connect API key)
# and uploads it to TestFlight internal testing. It is skipped until the signing
# secrets are configured, and needs an Apple Developer Program account plus an
# App Store Connect app record for the bundle id ai.rebot.capture.

name: mobile

on:
  push:
    paths:
      - "examples/mobile/**"
      - "examples/host/web/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "examples/mobile/**"
      - "examples/host/web/**"
      - ".github/workflows/mobile.yml"

defaults:
  run:
    working-directory: examples/mobile

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Install Node
        run: apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
      - name: Generate fixtures from the guide's web JS
        run: node tools/gen_fixtures.js RebotCore/Tests/RebotCoreTests/Fixtures "$GITHUB_WORKSPACE"
      - name: Run core tests
        working-directory: examples/mobile/RebotCore
        run: swift test

  ios-sdk-tests:
    # Intel pool: the arm64 macos-15 pool has a capacity incident where jobs
    # queue for 15 min and are cancelled (actions/runner#4833). Xcode 16 here
    # still satisfies the Xcode 15+ requirement; the simulator build is
    # architecture-agnostic.
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 45
    env:
      CLONED_SOURCE_PACKAGES_DIR_PATH: ${{ github.workspace }}/examples/mobile/.spm
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate fixtures from the guide's web JS
        run: node tools/gen_fixtures.js RebotCore/Tests/RebotCoreTests/Fixtures "$GITHUB_WORKSPACE"
      - name: Generate Xcode project
        run: xcodegen generate
      # Pick the first available iPhone simulator on this runner's Xcode.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) *\(.*$/\1/' | xargs)
          echo "Testing on iOS Simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: examples/mobile/.spm
          key: spm-packages
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project RebotCapture.xcodeproj -scheme RebotCapture -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR_PATH"
      - name: Build and test against the iOS SDK
        run: >
          xcodebuild test
          -project RebotCapture.xcodeproj
          -scheme RebotCapture
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}"
          -configuration Debug
          -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR_PATH"
          CODE_SIGNING_ALLOWED=NO
          -resultBundlePath build/RebotCapture.xcresult
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: RebotCapture.xcresult
          path: examples/mobile/build/RebotCapture.xcresult
          retention-days: 7

  # Publish every iOS change landed on main to TestFlight (internal testing).
  # Automatic signing via an App Store Connect API key (-allowProvisioningUpdates)
  # means Xcode manages the distribution cert + App Store profile itself, so the
  # only secrets needed are the API key (.p8), its id/issuer, and the team id.
  # The job no-ops with a notice until those secrets are set.
  testflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLONED_SOURCE_PACKAGES_DIR_PATH: ${{ github.workspace }}/examples/mobile/.spm
    steps:
      - name: Check TestFlight signing configuration
        id: gate
        run: |
          if [ -n "$ASC_KEY_BASE64" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight publish skipped — set the APP_STORE_CONNECT_API_KEY_BASE64, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID and APPLE_TEAM_ID secrets to enable it."
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.configured == 'true'
      - name: Install XcodeGen
        if: steps.gate.outputs.configured == 'true'
        run: command -v xcodegen || brew install xcodegen
      - name: Generate fixtures from the guide's web JS
        if: steps.gate.outputs.configured == 'true'
        run: node tools/gen_fixtures.js RebotCore/Tests/RebotCoreTests/Fixtures "$GITHUB_WORKSPACE"
      - name: Generate Xcode project
        if: steps.gate.outputs.configured == 'true'
        run: xcodegen generate
      - name: Cache SPM checkouts
        if: steps.gate.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: examples/mobile/.spm
          key: spm-packages
      - name: Write App Store Connect API key
        if: steps.gate.outputs.configured == 'true'
        run: |
          python3 - "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, os, sys
          open(sys.argv[1], "wb").write(base64.b64decode(os.environ["ASC_KEY_BASE64"]))
          PY
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Archive (Release, automatic signing)
        if: steps.gate.outputs.configured == 'true'
        run: >
          xcodebuild archive
          -project RebotCapture.xcodeproj
          -scheme RebotCapture
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/RebotCapture.xcarchive"
          -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR_PATH"
          -allowProvisioningUpdates
          -authenticationKeyPath "$AUTH_KEY_PATH"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          CODE_SIGN_STYLE=Automatic
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - name: Export IPA
        if: steps.gate.outputs.configured == 'true'
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RebotCapture.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # altool is Apple's bundled uploader; swap for Transporter/fastlane if it
      # is ever removed from Xcode. The API key must be named AuthKey_<id>.p8 in
      # one of altool's search paths.
      - name: Upload to TestFlight
        if: steps.gate.outputs.configured == 'true'
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"