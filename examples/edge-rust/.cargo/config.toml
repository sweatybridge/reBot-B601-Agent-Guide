# Rust ships a linker (rust-lld) and a self-contained musl libc for these
# targets, so pointing cargo at rust-lld is enough: no arm/aarch64 C toolchain
# is needed to cross-build the static binary.
[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
