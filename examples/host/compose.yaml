# The host side of the phone-capture pipeline, in one place.
#
#   mediamtx  WebRTC relay: the phone publishes here, /live reads here
#   capture   HTTPS endpoint, tap -> capture -> plan, WHIP/WHEP relay   -> :8443
#   planner   the arm gateway: edge /pose, Pinocchio planning, optional execute
#   tools     one-shot CLI: calibrate, make_cert, selftest
#
#   cp .env.example .env        # REBOT_HOST_IP, tag placement, REBOT_EDGE_URL
#   docker compose up -d --build
#   docker compose --profile tools run --rm tools calibrate_intrinsics.py
#
# The phone only ever talks to :8443. MediaMTX's signaling stays on the compose
# network and is reached through the relay in capture_server.py; only the media
# port 8189/udp is published, because after the handshake the phone sends RTP
# straight to <REBOT_HOST_IP>:8189.
#
# Everything that persists lives in ./state/{captures,calib,tls,tags,out,work},
# mounted at /app/state so the paths are the same inside and outside.
name: rebot-capture

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    environment:
      # A container's own interface addresses are useless to a phone on the
      # LAN, so advertise exactly one address and nothing else.
      MTX_WEBRTCIPSFROMINTERFACES: "no"
      MTX_WEBRTCADDITIONALHOSTS: ${REBOT_HOST_IP:-}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
      # Calibration sweeps are recorded here by MediaMTX and read back by the
      # capture server, which mounts ./state at /app/state.
      - ./state/recordings:/recordings
    ports:
      # RTSP is published so a host-run tool (or a debugger) can read the same
      # stream the capture server uses: rtsp://127.0.0.1:8554/phone.
      - "8554:8554"
      # The control API on loopback only: a CLI run on this host needs it to
      # record a sweep; nothing on the LAN can reach it.
      - "127.0.0.1:9997:9997"
      - "8189:8189/udp"

  capture:
    build: .
    image: rebot-capture:local
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "${REBOT_PORT:-8443}:8443"
    environment:
      REBOT_PORT: "8443"
      REBOT_CERT: /app/state/tls/cert.pem
      REBOT_KEY: /app/state/tls/key.pem
      REBOT_TOKEN: ${REBOT_TOKEN:-}
      REBOT_MEDIAMTX: http://mediamtx:8889
      REBOT_PLANNER: http://planner:8000
      # Where a sweep is recorded (MediaMTX writes it; this server reads it) and
      # the API that starts and stops that recording.
      REBOT_RECORDINGS: /app/state/recordings
      REBOT_MEDIAMTX_API: http://mediamtx:9997
      # A 4 cm ArUco tag on the base: where it sits in the robot's frame,
      # "x,y,z[,yaw]" in metres and degrees. Handheld mode reads it on every tap;
      # fixed mode does not use it. Print docs/base-marker.pdf at actual size.
      REBOT_MARKER_AT: ${REBOT_MARKER_AT:-}
      REBOT_MARKER_SIZE: ${REBOT_MARKER_SIZE:-0.04}
      REBOT_MODE: ${REBOT_MODE:-}
      # Where the arm ends: above the tapped point, with the tip a known distance
      # below the flange the planner aims.
      REBOT_HOVER_M: ${REBOT_HOVER_M:-0.10}
      REBOT_TIP_MM: ${REBOT_TIP_MM:-35}
      REBOT_PLANNER_TOKEN: ${REBOT_PLANNER_TOKEN:-}
      REBOT_EXECUTE: ${REBOT_EXECUTE:-0}
      REBOT_CALIB_DIR: /app/state/calib
      # A rig from calibrate_extrinsics.py --auto: fixed camera, taps need no tag.
      REBOT_EXTRINSICS: ${REBOT_EXTRINSICS:-}
      REBOT_WITNESS_MAX_PX: ${REBOT_WITNESS_MAX_PX:-2.0}
      # Where the automatic calibration sweep reads its stills.
      REBOT_CAMERA: ${REBOT_CAMERA:-rtsp://mediamtx:8554/phone}
      REBOT_PLANE_Z: ${REBOT_PLANE_Z:-0.0}
      REBOT_TOOL_AXIS: ${REBOT_TOOL_AXIS:-current}
      REBOT_YAW: ${REBOT_YAW:-0.0}
    volumes:
      # Mounted as well as copied, so a change to the server or the panel takes
      # effect on restart instead of a rebuild. The image still stands alone
      # where the checkout is not present.
      - ./app:/app/app:ro
      - ./web:/app/web:ro
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  planner:
    build:
      # Pinocchio publishes no win_amd64 wheels, so the arm gateway is its own
      # image; the app is mounted, not copied, so edits need no rebuild.
      context: ../..
      dockerfile: examples/host/Dockerfile.pinocchio
    image: rebot-pino
    restart: unless-stopped
    command: ["python", "/app/app/planner_server.py"]
    working_dir: /app
    environment:
      REBOT_EDGE_URL: ${REBOT_EDGE_URL:-http://raspberrypi:8081}
      REBOT_EDGE_TOKEN: ${REBOT_EDGE_TOKEN:-}
      REBOT_EXECUTE: ${REBOT_EXECUTE:-0}
      REBOT_PLANNER_TOKEN: ${REBOT_PLANNER_TOKEN:-}
      REBOT_KP: ${REBOT_KP:-50,2:150,3:150}
      REBOT_KD: ${REBOT_KD:-3,2:10,3:10,4:5,5:4,6:4,7:4}
      REBOT_OUT: /app/state/out
    volumes:
      - ./app:/app/app:ro
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tools:
    profiles: ["tools"]
    build: .
    image: rebot-capture:local
    working_dir: /app
    entrypoint: ["python"]
    environment:
      REBOT_HOST_IP: ${REBOT_HOST_IP:-}
    volumes:
      - ./state:/app/state
