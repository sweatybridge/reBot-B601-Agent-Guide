# The host side of the phone-capture pipeline, in one place.
#
#   substrate durable Postgres: pg_durable + pgvector + rebot_kinematics (§8)
#   mediamtx  WebRTC relay: the phone publishes here, /live reads here
#   capture   HTTPS endpoint, tap -> capture -> plan, WHIP/WHEP relay   -> :8443
#   planner   the arm gateway: edge /pose, Pinocchio planning, optional execute
#   tools     one-shot CLI: calibrate, make_cert, selftest
#
#   cp .env.example .env        # REBOT_HOST_IP, tag placement, REBOT_EDGE_URL
#   docker compose up -d --build
#   docker compose --profile tools run --rm tools app/calibrate_intrinsics.py
#
# The phone only ever talks to :8443 and :8189/udp. MediaMTX's signaling stays
# on the compose network and is reached through the relay in capture_server.py;
# the media port 8189/udp is published because after the handshake the phone
# sends RTP straight to <REBOT_HOST_IP>:8189. Also published: 8554 (RTSP, for
# host-run tools) and the control API on 127.0.0.1:9997 (host loopback only).
#
# Everything authoritative lives in the substrate (Postgres). The only bind
# mounts are config/ (tls + bootstrap), export/ (derived handoff bundles), and
# work/ — disposable scratch: cv2 materializations, the MediaMTX spool, and
# file-mode artifacts when no substrate is configured. No state/ directory.
name: rebot-capture

services:
  substrate:
    # The durable substrate (§8): pg_durable (duroxide) + pgvector + the
    # rebot_kinematics pgrx extension. System of record for traces, evidence,
    # learning, and orchestration. Data on a named volume, never a bind mount.
    build:
      context: ./substrate
      dockerfile: Dockerfile
    image: rebot-substrate:pg18
    container_name: rebot-substrate
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${REBOT_PG_PASSWORD:-rebot}
    ports:
      # Loopback only: never expose Postgres on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume (auto-created on fresh hosts; shares existing dev volume).
      - substrate_rebot-pgdata:/var/lib/postgresql
      - ./substrate/migrations:/migrations:ro
      - ./substrate/tests:/tests:ro
    # http_security=unrestricted is DEV-ONLY (df.http() to the isolated embed
    # activity on the host); production keeps 'restricted' + approved HTTPS.
    command: ["postgres", "-c", "shared_preload_libraries=pg_durable",
              "-c", "pg_durable.http_security=unrestricted"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    environment:
      # A container's own interface addresses are useless to a phone on the
      # LAN, so advertise exactly one address and nothing else.
      MTX_WEBRTCIPSFROMINTERFACES: "no"
      MTX_WEBRTCADDITIONALHOSTS: ${REBOT_HOST_IP:-}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
      # Calibration sweeps are recorded here by MediaMTX (transient spool); the
      # capture server ingests completed recordings into PG and deletes them.
      - ./work/recordings:/recordings
    ports:
      # RTSP is published so a host-run tool (or a debugger) can read the same
      # stream the capture server uses: rtsp://127.0.0.1:8554/phone.
      - "8554:8554"
      # The control API on loopback only: a CLI run on this host needs it to
      # record a sweep; nothing on the LAN can reach it.
      - "127.0.0.1:9997:9997"
      - "8189:8189/udp"

  capture:
    build: .
    image: rebot-capture:local
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      substrate:
        condition: service_healthy
      activities:
        condition: service_started
    ports:
      - "${REBOT_PORT:-8443}:8443"
    environment:
      REBOT_PORT: "8443"
      REBOT_CERT: /app/config/tls/cert.pem
      REBOT_KEY: /app/config/tls/key.pem
      # Durable substrate (§8 cutover): PG-primary reads when set; file fallback otherwise.
      # The substrate service is on the compose network; 5433 is also published on the host.
      REBOT_PG_DSN: ${REBOT_PG_DSN:-postgresql://postgres:${REBOT_PG_PASSWORD:-rebot}@substrate:5432/postgres}
      REBOT_PG_WORKSPACE: ${REBOT_PG_WORKSPACE:-default}
      REBOT_PG_ARM: ${REBOT_PG_ARM:-b601}
      REBOT_TOKEN: ${REBOT_TOKEN:-}
      REBOT_ACTIVITY_TOKEN: ${REBOT_ACTIVITY_TOKEN:-}
      REBOT_MEDIAMTX: http://mediamtx:8889
      REBOT_PLANNER: http://planner:8000
      # The isolated execute/extract/detect activity (capture/planner merge).
      # /execute runs the durable chain when this and REBOT_PG_DSN are set.
      REBOT_WORKFLOW_URL: ${REBOT_WORKFLOW_URL:-http://activities:8766}
      # Where a sweep is recorded (MediaMTX writes it; this server ingests it
      # into PG and deletes the spool file) and the API that starts/stops it.
      REBOT_RECORDINGS: /app/work/recordings
      REBOT_MEDIAMTX_API: http://mediamtx:9997
      # A 4 cm ArUco tag on the base: where it sits in the robot's frame,
      # "x,y,z[,yaw[,id]]" in metres and degrees. Handheld mode reads it on every tap;
      # fixed mode reads it in the calibration capture and writes the rig.
      REBOT_MARKER_AT: ${REBOT_MARKER_AT:-}
      REBOT_MARKER_SIZE: ${REBOT_MARKER_SIZE:-0.04}
      # Height of the tap plane above the worktop: the tip is planned at the
      # tapped x/y, at plane_z + hover_m (or vertical_hover_m in top-down mode).
      REBOT_HOVER_M: ${REBOT_HOVER_M:-0.04}
      REBOT_VERTICAL_HOVER_M: ${REBOT_VERTICAL_HOVER_M:-0.0}
      REBOT_TIP_MM: ${REBOT_TIP_MM:-35}
      REBOT_PLANNER_TOKEN: ${REBOT_PLANNER_TOKEN:-}
      REBOT_EXECUTE: ${REBOT_EXECUTE:-0}
      REBOT_PLAY_TIMEOUT: ${REBOT_PLAY_TIMEOUT:-900}
      # A fitted rig is read from the substrate (PG) at startup; the scratch
      # cache under /app/work/calib is materialized from it.
      REBOT_CALIB_DIR: /app/work/calib
      # Bench-default intrinsics: the 1080x1920 portrait calibration the active
      # rig was fitted against. It is mounted from config/ so a wiped work/ or a
      # stray synthetic.json cannot silently become the default.
      REBOT_CALIB: ${REBOT_CALIB:-/app/config/calib/4f68b7f34a702b1c043f44fcf805ac9a63e2a3d9.json}
      REBOT_WITNESS_MAX_PX: ${REBOT_WITNESS_MAX_PX:-2.0}
      # Where the automatic calibration sweep reads its stills.
      REBOT_CAMERA: ${REBOT_CAMERA:-rtsp://mediamtx:8554/phone}
      REBOT_PLANE_Z: ${REBOT_PLANE_Z:-0.0}
      REBOT_TOOL_AXIS: ${REBOT_TOOL_AXIS:-current}
      REBOT_YAW: ${REBOT_YAW:-0.0}
      # The agent sidebar: an OpenAI-compatible endpoint and the vision model.
      # Inside the container localhost is the container itself, so the host's
      # Ollama is reached through the gateway alias below. Empty URL turns the
      # sidebar off. The page can neither see nor change any of this.
      REBOT_LLM_URL: ${REBOT_LLM_URL:-http://host.docker.internal:11434/v1/chat/completions}
      REBOT_LLM_MODEL: ${REBOT_LLM_MODEL:-Qwen3.8-27B}
      REBOT_LLM_TOKEN: ${REBOT_LLM_TOKEN:-}
      REBOT_LLM_TEMPERATURE: ${REBOT_LLM_TEMPERATURE:-0.2}
      REBOT_LLM_MAX_TOKENS: ${REBOT_LLM_MAX_TOKENS:-1024}
      # 0 means "read meta.n_ctx from /v1/models"; set it only for a server that
      # does not expose its context.
      REBOT_LLM_CONTEXT_TOKENS: ${REBOT_LLM_CONTEXT_TOKENS:-0}
      REBOT_LLM_TIMEOUT: ${REBOT_LLM_TIMEOUT:-300}
    extra_hosts:
      # host.docker.internal exists by default on Docker Desktop; on Linux this
      # is what makes the host's Ollama reachable under that name.
      - "host.docker.internal:host-gateway"
    volumes:
      # Mounted as well as copied, so a change to the server or the panel takes
      # effect on restart instead of a rebuild. The image still stands alone
      # where the checkout is not present.
      - ./app:/app/app:ro
      - ./web:/app/web:ro
      - ./substrate:/app/substrate:ro
      # Disposable scratch (§8 flatten): cv2 materializations + spool. PG is
      # the system of record; wiping work/ loses nothing authoritative.
      - ./work:/app/work
      # Flatten (§8): tls/bootstrap live in config/, handoff bundles in export/.
      - ./config:/app/config
      - ./export:/app/export
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  activities:
    # The isolated execute/extract/detect activity: the planner half (edge
    # playback + telemetry) and the capture half (recording decode + tip
    # detection) in ONE short-lived process, reached by pg_durable via df.http().
    # Native cv2/FFmpeg work lives here, never in a postmaster child.
    build: .
    image: rebot-capture:local
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      substrate:
        condition: service_healthy
      planner:
        condition: service_started
    command: ["python", "/app/substrate/workflow_service.py", "--port", "8766"]
    working_dir: /app
    environment:
      REBOT_PG_DSN: ${REBOT_PG_DSN:-postgresql://postgres:${REBOT_PG_PASSWORD:-rebot}@substrate:5432/postgres}
      REBOT_PG_WORKSPACE: ${REBOT_PG_WORKSPACE:-default}
      REBOT_PG_ARM: ${REBOT_PG_ARM:-b601}
      REBOT_ACTIVITY_TOKEN: ${REBOT_ACTIVITY_TOKEN:-}
      REBOT_PLANNER: http://planner:8000
      REBOT_PLANNER_TOKEN: ${REBOT_PLANNER_TOKEN:-}
      REBOT_EDGE_URL: ${REBOT_EDGE_URL:-http://raspberrypi:8081}
      REBOT_MEDIAMTX_API: http://mediamtx:9997
      REBOT_RECORDINGS: /app/work/recordings
      REBOT_CAMERA: ${REBOT_CAMERA:-rtsp://mediamtx:8554/phone}
      REBOT_EXECUTE: ${REBOT_EXECUTE:-0}
      REBOT_PLAY_TIMEOUT: ${REBOT_PLAY_TIMEOUT:-900}
      REBOT_WORKFLOW_DRY: ${REBOT_WORKFLOW_DRY:-0}
      REBOT_KP: ${REBOT_KP:-50,2:150,3:150}
      REBOT_KD: ${REBOT_KD:-3,2:10,3:10,4:5,5:4,6:4,7:4}
    volumes:
      - ./app:/app/app:ro
      - ./substrate:/app/substrate:ro
      - ./work:/app/work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  planner:
    build:
      # Pinocchio publishes no win_amd64 wheels, so the arm gateway is its own
      # image; the app is mounted, not copied, so edits need no rebuild.
      context: ../..
      dockerfile: examples/host/Dockerfile.pinocchio
    image: rebot-pino
    restart: unless-stopped
    depends_on:
      substrate:
        condition: service_healthy
    command: ["python", "/app/app/planner_server.py"]
    working_dir: /app
    environment:
      REBOT_EDGE_URL: ${REBOT_EDGE_URL:-http://raspberrypi:8081}
      REBOT_EDGE_TOKEN: ${REBOT_EDGE_TOKEN:-}
      REBOT_EXECUTE: ${REBOT_EXECUTE:-0}
      REBOT_PLAY_TIMEOUT: ${REBOT_PLAY_TIMEOUT:-900}
      REBOT_PLANNER_TOKEN: ${REBOT_PLANNER_TOKEN:-}
      REBOT_KP: ${REBOT_KP:-50,2:150,3:150}
      REBOT_KD: ${REBOT_KD:-3,2:10,3:10,4:5,5:4,6:4,7:4}
      REBOT_PG_DSN: ${REBOT_PG_DSN:-postgresql://postgres:${REBOT_PG_PASSWORD:-rebot}@substrate:5432/postgres}
      REBOT_PG_WORKSPACE: ${REBOT_PG_WORKSPACE:-default}
      REBOT_PG_ARM: ${REBOT_PG_ARM:-b601}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app:ro
      - ./substrate:/app/substrate:ro
      - ./work:/app/work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tools:
    profiles: ["tools"]
    build: .
    image: rebot-capture:local
    working_dir: /app
    entrypoint: ["python"]
    environment:
      REBOT_HOST_IP: ${REBOT_HOST_IP:-}
      REBOT_PG_DSN: ${REBOT_PG_DSN:-postgresql://postgres:${REBOT_PG_PASSWORD:-rebot}@substrate:5432/postgres}
      REBOT_PG_WORKSPACE: ${REBOT_PG_WORKSPACE:-default}
      REBOT_PG_ARM: ${REBOT_PG_ARM:-b601}
    volumes:
      - ./app:/app/app:ro
      - ./web:/app/web:ro
      - ./substrate:/app/substrate:ro
      - ./tests:/app/tests:ro
      - ./config:/app/config
      - ./export:/app/export
      - ./work:/app/work

volumes:
  # Explicit volume name so both composes share the database AND a fresh host
  # creates it automatically without needing `external: true`.
  substrate_rebot-pgdata:
    name: ${REBOT_PG_VOLUME:-substrate_rebot-pgdata}
